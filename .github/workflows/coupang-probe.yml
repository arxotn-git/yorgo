name: Coupang free runner probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Test public access without credentials
        run: |
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch();
          const page = await browser.newPage();
          for (const url of ["https://advertising.coupang.com/marketing/campaign/registration?goalType%3DSALES&_cap_client=SUPPLIERHUB", "https://supplier.coupang.com/"]) {
            try {
              const response = await page.goto(url, {waitUntil:"domcontentloaded", timeout:60000});
              await page.waitForTimeout(3000);
              if (response?.status() === 403) process.exitCode=1;
              console.log(JSON.stringify({host:new URL(url).hostname,status:response?.status(),title:await page.title(),pageHost:new URL(page.url()).hostname,text:(await page.locator("body").innerText()).slice(0,2000),inputs:await page.locator("input").evaluateAll(es=>es.map(e=>({type:e.type,name:e.name,id:e.id,placeholder:e.placeholder})))}));
            } catch(e) { console.log("Connection failed: "+e.message); process.exitCode=1; }
          }
          await browser.close();
          JS
