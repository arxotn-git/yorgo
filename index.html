const INVENTORY_FIELDS = ['RD','RI','DATES','STOCK','INC','AORDER','EXCEL_LAYOUT'];
const INVENTORY_FORMAT = 'gzip-json-v1';
const inventoryPayload = data => Object.fromEntries(INVENTORY_FIELDS.filter(k=>data[k]!==undefined).map(k=>[k,data[k]]));
const inventoryToBase64 = bytes => {
    let text='';
    for(let i=0;i<bytes.length;i+=8192)text+=String.fromCharCode(...bytes.subarray(i,i+8192));
    return btoa(text);
};
const decodeInventoryDocument = async raw => {
    if(!raw.packedInventory)return raw; // Existing documents remain readable.
    const packed=raw.packedInventory;
    if(packed.format!==INVENTORY_FORMAT)throw new Error('새 저장 형식입니다. 페이지를 새로고침해주세요.');
    if(INVENTORY_FIELDS.some(k=>Object.prototype.hasOwnProperty.call(raw,k)))throw new Error('이전 버전에서 저장된 변경사항이 감지됐습니다. 모든 재고 페이지를 새로고침한 뒤 확인해주세요.');
    if(typeof DecompressionStream==='undefined')throw new Error('최신 Chrome 또는 Edge에서 열어주세요.');
    const bytes=Uint8Array.from(atob(packed.data),c=>c.charCodeAt(0));
    const buffer=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    if(buffer.byteLength!==packed.rawBytes)throw new Error('저장 데이터 검증에 실패했습니다. 기존 자료를 변경하지 않았습니다.');
    const payload=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(buffer));
    if(!payload||typeof payload!=='object'||Array.isArray(payload)||Object.keys(payload).some(k=>!INVENTORY_FIELDS.includes(k)))throw new Error('재고 데이터 구조를 확인해주세요.');
    const {packedInventory,...metadata}=raw;
    return {...metadata,...payload};
};
const encodeInventoryDocument = async data => {
    if(typeof CompressionStream==='undefined'||typeof DecompressionStream==='undefined')throw new Error('최신 Chrome 또는 Edge에서 엑셀을 업로드해주세요.');
    const json=JSON.stringify(inventoryPayload(data));
    const rawBytes=new TextEncoder().encode(json).byteLength;
    const bytes=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    const packedInventory={format:INVENTORY_FORMAT,data:inventoryToBase64(bytes),rawBytes};
    // Verify lossless recovery before any write, including numbers, styles and order.
    const restored=await decodeInventoryDocument({packedInventory});
    if(JSON.stringify(restored)!==json)throw new Error('저장 전 복원 검증에 실패했습니다. 기존 자료를 변경하지 않았습니다.');
    const metadata=Object.fromEntries(Object.entries(data).filter(([k])=>!INVENTORY_FIELDS.includes(k)&&k!=='packedInventory'));
    if(new Blob([JSON.stringify({...metadata,packedInventory})]).size>900000)throw new Error('압축 후에도 저장 공간이 부족합니다. 원본과 기존 이력은 그대로이며, 분리 저장이 필요합니다.');
    return packedInventory;
};

    if(rocket)update.rocketUpdatedAt=firebase.firestore.FieldValue.serverTimestamp();

};

const mergeStockHistory = (stockObj) => {
    if(!stockObj) return {};
    const merged = {};
    Object.keys(stockObj).forEach(oldKey => {
        const cleanK = cleanSku(oldKey);
        if(!merged[cleanK]) {
            merged[cleanK] = [...stockObj[oldKey]];
        } else {
            stockObj[oldKey].forEach((val, i) => {
                merged[cleanK][i] = (merged[cleanK][i] || 0) + (val || 0);
            });
        }
    });
    return merged;
};

const cleanGhostDates = (existingDates, newDates) => {
    if(!newDates.length) return existingDates;
    const minD = newDates[0];
    const maxD = newDates[newDates.length - 1];
    
    const filtered = existingDates.filter(d => {
        if (d >= minD && d <= maxD) {
            return newDates.includes(d);
        }
        return true; 
    });
    return [...new Set([...filtered, ...newDates])].sort();
};

const parseCellToParts = cell => {
    if (cell == null || cell === "") return null;

        if (n > 40000 && n < 60000) {
            const dt = new Date(Math.round((n-25569)*86400000));
            return { y: dt.getFullYear(), m: dt.getMonth()+1, d: dt.getDate(), suffix: "" };
        }
        return null;
    }
    const km = s.match(/(\d{2,4})년\s*(\d{1,2})월\s*(\d{1,2})일?/);
    if (km) { const y=km[1].length===2?2000+parseInt(km[1]):parseInt(km[1]); return {y,m:parseInt(km[2]),d:parseInt(km[3]),suffix:""}; }
    const m4 = s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})(\s*[\(\[].+)?$/);
    if (m4) return {y:parseInt(m4[1]),m:parseInt(m4[2]),d:parseInt(m4[3]),suffix:m4[4]?.trim()?" "+m4[4].trim():""};
    const m3 = s.match(/^(\d{2})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})(\s*[\(\[].+)?$/);
    if (m3) return {y:2000+parseInt(m3[1]),m:parseInt(m3[2]),d:parseInt(m3[3]),suffix:m3[4]?.trim()?" "+m3[4].trim():""};
    const m2 = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})(\s*[\(\[].+)?$/);
    if (m2) return {y:null,m:parseInt(m2[1]),d:parseInt(m2[2]),suffix:m2[3]?.trim()?" "+m2[3].trim():""};
    return null;
};

const findHeaderRow = (rows, skipCols=0) => {
    let best=0, bestCount=0;
    for (let r=0; r<Math.min(6,rows.length); r++) {
        let cnt=0;
        (rows[r]||[]).forEach((c,i)=>{ if(i>=skipCols && parseCellToParts(c)) cnt++; });
        if (cnt>bestCount) { bestCount=cnt; best=r; }
    }
    return bestCount>0 ? best : 0;
};

const parseSheetWithTimeline = (sheet, skipCols=0) => {
    if (!sheet) return null;
    let rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:""});
    let hri = findHeaderRow(rows, skipCols);
    if (hri===0 && rows.length>0 && !rows[0].some((c,i)=>i>=skipCols&&parseCellToParts(c))) {
        rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:""});
        hri = findHeaderRow(rows, skipCols);
    }
    const hRow = rows[hri]||[];
    const dCols = [];
    let anchorYear = new Date().getFullYear();
    for (let i = hRow.length-1; i >= skipCols; i--) {
        const p = parseCellToParts(hRow[i]);
        if (p && p.y) { anchorYear = p.y; break; }
    }
    let currentYear = anchorYear, lastMonth = null;
    for (let i = hRow.length-1; i >= skipCols; i--) {
        const p = parseCellToParts(hRow[i]);
        if (!p) continue;
        if (p.y) { currentYear = p.y; lastMonth = p.m; }
        else {
            if (lastMonth !== null) {
                if (p.m > lastMonth && (p.m - lastMonth) > 5) currentYear--;
                else if (lastMonth > p.m && (lastMonth - p.m) > 5) currentYear++;
            }
            lastMonth = p.m;
        }
        // Excel date cells retain (2), (3) in the display format rather than their numeric value.
        const range=sheet['!ref']?XLSX.utils.decode_range(sheet['!ref']):{s:{r:0,c:0}};
        const headerCell=sheet[XLSX.utils.encode_cell({r:range.s.r+hri,c:range.s.c+i})];
        const shown=headerCell?XLSX.utils.format_cell(headerCell):'';
        const runSuffix=String(shown).match(/\s*\((\d+)\)\s*$/);
        const suffix=p.suffix||(runSuffix?' ('+runSuffix[1]+')':'');
        const dateStr = `${currentYear}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}${suffix}`;
        dCols.unshift({ index: i, label: dateStr });
    }
    return { rows, hri, dCols, parsedDates: dCols.map(c=>c.label) };
};

// Spreadsheet appearance is authoritative; defaults apply only before an Excel import.

const normalizeWebColor=value=>/^#[0-9A-F]{6}$/i.test(value||'')?value.toUpperCase():null;
const softExcelColor=value=>{
    const hex=normalizeWebColor(value);if(!hex||hex==='#FFFFFF')return '#FFFFFF';
    const [r,g,b]=hex.slice(1).match(/../g).map(v=>parseInt(v,16));
    if(Math.max(r,g,b)-Math.min(r,g,b)<35)return '#F1F5F9';
    if(b>r*1.25&&b>g*1.1)return '#D9E7FA';
    if(g>r*1.15&&g>b*1.1)return '#E0EFD5';
    if(r>180&&g>150&&b<150)return '#FFF2B8';
    if(g>r*1.15&&b>r*1.15)return '#D7F0F2';
    if(r>g*1.2&&b>g*1.2)return '#EBDFF5';
    if(r>g*1.3&&r>b*1.2)return '#FADDE1';

};

const readExcelTheme=workbook=>{
    const colors=['FFFFFF','000000','E7E6E6','44546A','4472C4','ED7D31','A5A5A5','FFC000','5B9BD5','70AD47','0563C1','954F72'];

const excelColor=(color,theme,fallback)=>{
    if(!color)return fallback;
    const indexed=['000000','FFFFFF','FF0000','00FF00','0000FF','FFFF00','FF00FF','00FFFF','000000','FFFFFF','FF0000','00FF00','0000FF','FFFF00','FF00FF','00FFFF','800000','008000','000080','808000','800080','008080','C0C0C0','808080','9999FF','993366','FFFFCC','CCFFFF','660066','FF8080','0066CC','CCCCFF','000080','FF00FF','FFFF00','00FFFF','800080','800000','008080','0000FF','00CCFF','CCFFFF','CCFFCC','FFFF99','99CCFF','FF99CC','CC99FF','FFCC99','3366FF','33CCCC','99CC00','FFCC00','FF9900','FF6600','666699','969696','003366','339966','003300','333300','993300','993366','333399','333333'];
    let hex=color.argb?.slice(-6)||(color.theme!=null?theme[color.theme]:null)||(color.indexed!=null?indexed[color.indexed]:null);

const readCellAppearance=(cell,theme)=>{

};
const importRocketSheet=(sheet,styledSheet,theme,existingItems,existingDates)=>{
    const p=parseSheetWithTimeline(sheet,3);
    if(!p?.dCols.length)throw new Error('로켓배송 시트에서 날짜 열을 찾지 못했습니다. 상품명 / 구성 / SKU ID 다음에 날짜 열이 있어야 합니다.');
    if(new Set(p.parsedDates).size!==p.parsedDates.length)throw new Error('로켓배송 시트의 날짜 열이 중복됩니다. (2), (3)처럼 구분해주세요.');
    const oldMap=new Map(existingItems.map(x=>[excelItemKey(x.name,x.option),x]));
    const seen=new Set(),matched=new Set(),items=[];
    const startRow=sheet['!ref']?XLSX.utils.decode_range(sheet['!ref']).s.r:0;
    for(let i=p.hri+1;i<p.rows.length;i++){
        const row=p.rows[i];if(!row?.length)continue;
        const cellValue=c=>{const v=styledSheet?.getCell(startRow+i+1,c+1)?.value;return v&&typeof v==='object'?(v.richText?v.richText.map(r=>r.text).join(''):v.result??''):v;};
        const name=String(row[0]||cellValue(0)||'').trim(),option=String(row[1]||cellValue(1)||'').trim(),skuId=String(row[2]??'').trim();
        if(!name||name==='undefined')continue;
        const key=stockItemKey({name,option,skuId});if(seen.has(key))throw new Error('엑셀 상품 중복: '+name+' / '+option+' / '+skuId);seen.add(key);
        const skuMatches=skuId&&skuId!=='-'?existingItems.filter(x=>String(x.skuId||'').trim()===skuId):[];
        const previous=(skuMatches.length===1?skuMatches[0]:oldMap.get(excelItemKey(name,option)))||{};
        if(matched.has(previous))throw new Error('기존 상품에 두 행이 연결됩니다. SKU ID를 확인해주세요: '+skuId);
        if(previous.name)matched.add(previous);
        const item={...previous,name,option,skuId,excelActive:true,history:{...(previous.history||{})},excelDateStyles:{...(previous.excelDateStyles||{})}};
        const mapping=resolveStockMapping(previous,existingItems)||resolveStockMapping(item,existingItems);
        if(mapping)item.stockLink={vendorItemId:mapping.vendorItemId};
        const nativeRow=styledSheet?.getRow(startRow+i+1);
        item.excelRowHidden=!!nativeRow?.hidden;
        item.excelRowHeight=nativeRow?.height||20;
        item.excelNativeStyles=[0,1,2].map(c=>JSON.parse(JSON.stringify(styledSheet?.getCell(startRow+i+1,c+1)?.style||{})));
        item.excelStyles=[0,1,2].map(c=>readCellAppearance(styledSheet?.getCell(startRow+i+1,c+1),theme));
        p.dCols.forEach((col,ci)=>{
            const raw=row[col.index];let value='-';
            if(raw!==''&&raw!=null){const numeric=typeof raw==='number'?raw:Number(String(raw).replace(/,/g,''));value=Number.isFinite(numeric)?Math.round(numeric):String(raw);}
            const date=p.parsedDates[ci];item.history[date]=value;
            const style=readCellAppearance(styledSheet?.getCell(startRow+i+1,col.index+1),theme);

            if(style.backgroundColor!=='#FFFFFF')item.excelDateStyles[date]={backgroundColor:style.backgroundColor};else delete item.excelDateStyles[date];
        });

const captureSheetLayout=(sheet,styled,theme,rocket=false)=>{
    if(!sheet||!styled)return null;
    let p=parseSheetWithTimeline(sheet,3);if(!p?.dCols.length)p=parseSheetWithTimeline(sheet,1);
    if(!p)return null;
    const start=sheet['!ref']?XLSX.utils.decode_range(sheet['!ref']).s.r:0;
    const headers=p.rows[p.hri]||[],headerRow=start+p.hri+1;
    const rowInfo={};
    for(let i=p.hri+1;i<p.rows.length;i++){
        const row=p.rows[i];if(!row?.[0])continue;
        const key=rocket?excelItemKey(row[0],row[1]):cleanSku(row[0]);
        const native=styled.getRow(start+i+1);
        rowInfo[key]={hidden:!!native.hidden,height:native.height||styled.properties.defaultRowHeight||20,outlineLevel:native.outlineLevel||0};
    }
    const widths={};p.dCols.forEach((c,i)=>{widths[p.parsedDates[i]]=styled.getColumn(c.index+1).width||9;});
    return {name:styled.name,headerHeight:styled.getRow(headerRow).height||24,
        widths:[1,2,3].map(c=>styled.getColumn(c).width||[26,18,14][c-1]),dateWidths:widths,rows:rowInfo,
        headerStyles:[1,2,3,...p.dCols.map(c=>c.index+1)].slice(0,4).map(c=>readCellAppearance(styled.getCell(headerRow,c),theme)),
        summaryBelow:styled.properties.outlineProperties?.summaryBelow!==false};

const applyExportLayout=(workbook,data,asOf=todayKst())=>{
    const month=asOf.slice(0,7),layouts=data.EXCEL_LAYOUT||{};
    const configure=(sheet,dates,meta,keys)=>{
        if(!sheet)return;
        if(meta?.name&&!workbook.worksheets.some(s=>s!==sheet&&s.name===meta.name))sheet.name=meta.name;
        sheet.getRow(1).height=meta?.headerHeight||24;
        if(meta?.widths)meta.widths.forEach((w,i)=>{sheet.getColumn(i+1).width=w;});
        sheet.properties.outlineProperties={summaryRight:true,summaryBelow:meta?.summaryBelow!==false};
        sheet.properties.outlineLevelCol=1;
        let maxRowLevel=0;
        keys.forEach((key,i)=>{const r=sheet.getRow(i+2),info=meta?.rows?.[key];
            if(info){r.hidden=info.hidden;r.height=info.height;r.outlineLevel=info.outlineLevel;maxRowLevel=Math.max(maxRowLevel,info.outlineLevel);}
        });
        sheet.properties.outlineLevelRow=maxRowLevel;
        dates.forEach((date,i)=>{
            const col=sheet.getColumn(i+4),cell=sheet.getCell(1,i+4);
            const key=String(date).slice(0,10),suffix=String(date).match(/\((\d+)\)/)?.[1];
            if(/^\d{4}-\d{2}-\d{2}$/.test(key)){
                cell.value=new Date(key+'T00:00:00Z');cell.numFmt='m/d'+(suffix?'" ('+suffix+')"':'');
            }
            col.width=Math.min(12,Math.max(8,meta?.dateWidths?.[date]||9));
            const old=key.slice(0,7)<month;
            const isLastOfMonth=i===dates.length-1||String(dates[i+1]).slice(0,7)!==key.slice(0,7);
            col.outlineLevel=isLastOfMonth?0:1;col.hidden=old;
            Object.defineProperty(col,'collapsed',{value:old&&isLastOfMonth,configurable:true});
            if(meta?.headerStyles?.[3]){const st=meta.headerStyles[3];cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+st.backgroundColor.slice(1)}};cell.font={...cell.font,color:{argb:'FF'+st.color.slice(1)}};}
        });
        [1,2,3].forEach(c=>{const st=meta?.headerStyles?.[c-1];if(st){const cell=sheet.getCell(1,c);cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+st.backgroundColor.slice(1)}};cell.font={...cell.font,color:{argb:'FF'+st.color.slice(1)}};}});
        sheet.eachRow((row,n)=>{row.eachCell({includeEmpty:true},(cell,c)=>{
            cell.alignment={...cell.alignment,vertical:'middle',horizontal:c>=4?'center':'left'};
            if(n>1)cell.border={bottom:{style:'hair',color:{argb:'FFE2E8F0'}}};
        });});
        const lastOld=dates.reduce((last,d,i)=>String(d).slice(0,7)<month?i:last,-1);
        sheet.views=[{state:'frozen',xSplit:3,ySplit:1,topLeftCell:lastOld>=0?sheet.getCell(2,lastOld+5).address:'D2',showOutlineSymbols:true}];
    };
    const items=(data.RI||[]).filter(x=>x.excelActive!==false);
    configure(workbook.worksheets[0],data.RD||[],layouts.rocket,items.map(x=>excelItemKey(x.name,x.option)));
    items.forEach((item,i)=>{const row=workbook.worksheets[0].getRow(i+2);if(item.excelRowHidden!==undefined)row.hidden=item.excelRowHidden;if(item.excelRowHeight)row.height=item.excelRowHeight;
        (item.excelNativeStyles||[]).forEach((st,c)=>{if(st)row.getCell(c+1).style=JSON.parse(JSON.stringify(st));});
        (item.excelStyles||[]).forEach((st,c)=>{if(!st)return;const cell=row.getCell(c+1);
            if(/^#[0-9A-F]{6}$/i.test(st.backgroundColor||''))cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+st.backgroundColor.slice(1)}};
            if(/^#[0-9A-F]{6}$/i.test(st.color||''))cell.font={...cell.font,color:{argb:'FF'+st.color.slice(1)}};
        });
    });
    // 첫 영업일은 로켓 시트의 날짜 열 전체에 오렌지색을 적용한다.
    (data.RD||[]).forEach((date,i)=>{if(!isWeekStartDate(data.RD,i))return;
        const sheet=workbook.worksheets[0], column=i+4;
        for(let row=1;row<=sheet.rowCount;row++)sheet.getCell(row,column).fill={type:'pattern',pattern:'solid',fgColor:{argb:row===1?'FFFFEDD5':'FFFFF1DF'}};
    });
    const stock=data.STOCK||{},keys=[...new Set([...(data.AORDER||[]),...Object.keys(stock)])].filter(k=>stock[k]);
    configure(workbook.worksheets[1],data.DATES||[],layouts.argo,keys);
    return workbook;
};

                            <button key={String(opt.value)} type="button" onClick={()=>{onChange(opt.value);setOpen(false);}}
                                className={`w-full text-left px-4 py-2.5 text-sm font-semibold flex items-center justify-between border-b border-slate-800/40 last:border-0 ${String(opt.value)===String(value)?"bg-indigo-600/30 text-indigo-300 border-l-4 border-indigo-500":"text-slate-300 hover:bg-slate-800 hover:text-white"}`}>
                                <span>{opt.label}</span>{String(opt.value)===String(value)&&<span>✓</span>}
                            </button>
                        ))}
                    </div>
                )}
            </div>
        </div>
    );
}

    // 🔥 데이터 최초 로드 시 항상 최신 날짜(연/월/일)로 자동 세팅

    const [rY,setRY]=useState(()=>rYears[0]||CUR_Y);
    const rMons=useMemo(()=>rDates.length?[...new Set(rDates.filter(d=>d.startsWith(rY)).map(d=>d.slice(5,7)))].sort().reverse():[CUR_M],[rDates,rY,CUR_M]);

    useEffect(()=>{if(!rYears.includes(rY))setRY(rYears[0]);},[rYears]);
    useEffect(()=>{if(!rMons.includes(rM))setRM(rMons[0]);},[rY,rMons]);

    const nowYM=useMemo(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;},[]);
    const lastYM=useMemo(()=>{const n=new Date();const l=new Date(n.getFullYear(),n.getMonth()-1,1);return `${l.getFullYear()}-${String(l.getMonth()+1).padStart(2,'0')}`;},[]);

    // 화면 표시만 접습니다. 원본 날짜와 재고 데이터는 수정하지 않습니다.
    const [showAllDailyRuns,setShowAllDailyRuns]=useState(false);
    const dateDay=(value)=>{const match=String(value).match(/^(\d{4}-\d{2}-\d{2})(?: \((\d+)\))?$/);return match?match[1]:String(value);};
    const dateRun=(value)=>{const match=String(value).match(/^\d{4}-\d{2}-\d{2}(?: \((\d+)\))?$/);return match&&match[1]?Number(match[1]):1;};
    const visRD=useMemo(()=>{
        if(!rDates.length)return[];

    const filtRI=useMemo(()=>{

    const aRawMons=useMemo(()=>dbDates.length?[...new Set(dbDates.filter(d=>d.startsWith(aRawY)).map(d=>d.slice(5,7)))].sort().reverse():[CUR_M],[dbDates,aRawY,CUR_M]);
    const [aRawM,setARawM]=useState(()=>aRawMons[0]||CUR_M);

        }).map(sku=>({sku,history:dbStock[sku]}))

            if (ib === -1) ib = SKU_ORDER.indexOf(b.sku) > -1 ? SKU_ORDER.indexOf(b.sku) + 1000 : 9999;
            return ia - ib;

    },[dbStock,dbDates,visAD,aRawShowZero,aOrder,srch]);

    // ── N배송 ADS 계산 ──
    const [adsW,setAdsW]=useState(4);const [only30,setOnly30]=useState(true);

    const toDateKey=v=>{if(!v)return"";const dt=cleanDateForParse(v);if(!isNaN(dt.getTime()))return dt.toISOString().split('T')[0];const m=String(v).match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:String(v).split(" ")[0];};
    const calDays=(s,e)=>{if(isNaN(s.getTime())||isNaN(e.getTime())||e<=s)return 0;return Math.max(1,Math.ceil((e-s)/86400000));};
    
    const findWinByDays = (dates, ti, daysBack) => {
        const endKey = toDateKey(dates[ti]);
        const endDt = cleanDateForParse(endKey);

        const targetStartDt = new Date(endDt);
        targetStartDt.setDate(targetStartDt.getDate() - daysBack);
        const targetStartKey = targetStartDt.toISOString().split('T')[0];

        let startIdx = 0; 
        let actualStartKey = toDateKey(dates[0]);

        for (let i = ti; i >= 0; i--) {
            const k = toDateKey(dates[i]);
            if (k <= targetStartKey) {
                startIdx = i;
                actualStartKey = k;
                break;
            }
        }

        const actualStartDt = cleanDateForParse(actualStartKey);
        let daysElapsed = calDays(actualStartDt, endDt);
        
        if (daysElapsed < 1) daysElapsed = 1;

        return {
            startIndex: startIdx,
            endIndex: ti,
            startDate: actualStartKey,
            endDate: endKey,
            days: daysElapsed
        };
    };

    const aDI=useMemo(()=>{const i=dbDates.indexOf(aD);return i!==-1?i:Math.max(0,dbDates.length-1);},[aD,dbDates]);
    
    const calcSku=(sku,ti)=>{
        const win=findWinByDays(dbDates,ti,Number(adsW));
        
        let totalSales = 0;
        let validDays = 0;
        
        for (let i = win.startIndex; i < win.endIndex; i++) {
            const stockA = dbStock[sku]?.[i] || 0;
            const stockB = dbStock[sku]?.[i+1] || 0;
            
            const dtA = cleanDateForParse(toDateKey(dbDates[i]));
            const dtB = cleanDateForParse(toDateKey(dbDates[i+1]));
            let dayGap = calDays(dtA, dtB);
            if (dayGap < 1) dayGap = 1;
            
            let incAmt = 0;
            dbInc.forEach(inc => {
                if(inc.sku === sku) {
                    const iDt = cleanDateForParse(inc.date).getTime();
                    if(iDt > dtA.getTime() && iDt <= dtB.getTime()) {
                        incAmt += inc.amount;
                    }
                }
            });
            
            const realSales = stockA + incAmt - stockB;
            
            if (realSales >= 0) {
                totalSales += realSales;
                validDays += dayGap;
            }
        }
        
        let ads = 0;
        if (validDays > 0) {
            ads = totalSales / validDays;
        } else if (win.startIndex > 0) {
            for (let i = win.startIndex - 1; i >= 0; i--) {
                const sA = dbStock[sku]?.[i] || 0;
                const sB = dbStock[sku]?.[i+1] || 0;
                const dtA = cleanDateForParse(toDateKey(dbDates[i]));
                const dtB = cleanDateForParse(toDateKey(dbDates[i+1]));
                const dGap = Math.max(1, calDays(dtA, dtB));
                
                const diff = sA - sB;
                if (diff >= 0) {
                    ads = diff / dGap;
                    break;
                }
            }
        }

        ads = Math.max(0, parseFloat(ads.toFixed(2)));
        
        let pa = 0;
        dbInc.forEach(inc=>{
            if(inc.sku!==sku)return;
            const dt=cleanDateForParse(inc.date);
            if(isNaN(dt.getTime()))return;
            if(!inc.isRegistered) pa += inc.amount;
        });
        
        const cur=dbStock[sku]?.[win.endIndex]||0;
        let dr=Infinity,esd="안전 (우려없음)",drt="99일 이상";
        if(ads>0){
            const tot=cur+pa;
            dr=tot/ads;
            if(dr<365){
                const tDt=cleanDateForParse(win.endDate);
                const sd=new Date(tDt);
                sd.setDate(sd.getDate()+Math.floor(dr));
                esd=isNaN(sd.getTime())?"계산불가":sd.toISOString().split('T')[0];
                drt=`${Math.ceil(dr)}일 남음`;
            }
        }
        
        return{sku,category:CATS[sku]||"기타",currentStock:cur,ads,adsDays:win.days,adsStartDate:win.startDate,adsEndDate:win.endDate,daysRemaining:dr,displayRemainingText:drt,expectedStockoutDate:esd,replenishment30:ads>0?Math.ceil(ads*30):0,simulatedArrivals:pa};
    };
    
    const allSkus=useMemo(()=>Object.keys(dbStock).map(s=>calcSku(s,aDI)),[aDI,adsW,dbStock,dbDates,dbInc]);
    
    const filtSkus=useMemo(()=>allSkus.filter(i=>{
        if(exZero&&i.currentStock===0)return false;if(only30&&i.daysRemaining>30)return false;
        if(srch && !i.sku.toLowerCase().includes(srch.toLowerCase())) return false;
        return true;
    }).sort((a,b)=>a.daysRemaining-b.daysRemaining),[allSkus,only30,exZero,srch]);

    const pend=useMemo(()=>{
        if(!dbDates.length)return[];const lt=cleanDateForParse(dbDates[dbDates.length-1]).getTime();
        return dbInc.filter(i=>!i.isRegistered).map(i=>{

            const arr=cleanDateForParse(i.date);if(i.type==="택배")arr.setDate(arr.getDate()+3);

    const stockBusyRef = useRef(false);

    const bridgeRequest = (type, queries=[], timeout=8000) => new Promise((resolve,reject)=>{
        const requestId='stock-'+Date.now()+'-'+Math.random().toString(36).slice(2);
        const onMessage=e=>{const d=e.data||{};if(e.source!==window||e.origin!==location.origin||d.source!=='yorgo-extension'||d.requestId!==requestId)return;clearTimeout(timer);window.removeEventListener('message',onMessage);resolve(d);};
        const timer=setTimeout(()=>{window.removeEventListener('message',onMessage);reject(new Error(type==='YORGO_STOCK_PING'?'Chrome 보조 기능이 연결되지 않았습니다. 아래 설치 안내를 확인하고 설치 후 새로고침하세요.':'조회 응답이 늦어 저장하지 않았습니다. 잠시 뒤 다시 눌러주세요.'));},timeout);
        window.addEventListener('message',onMessage);window.postMessage({source:YORGO_STOCK_SOURCE,type,requestId,queries},location.origin);
    });
    const stockQuery = q => q.sourceQuery || ({'와우펜북':'와우펜','키즈탭 프로':'키즈탭','동화툰 패키지':'동화툰','보드마카+지우개':'지우개'}[q.name]||q.name);
    const inventoryQueries = () => {
        const latest=rDates[rDates.length-1];const map=new Map(STOCK_MAPPING.map(m=>[stockKey(m.name,m.option),m]));const seen=new Set(),queries=[],problems=[];
        const tracked=rItems.filter(item=>item.excelActive!==false&&isStockNumber(item.history?.[latest]));
        tracked.forEach(item=>{const key=stockItemKey(item);if(seen.has(key)){problems.push('중복 상품: '+item.name+' / '+item.option);return;}seen.add(key);const m=resolveStockMapping(item,rItems);if(!m)problems.push('상품 연결 확인 필요: '+item.name+' / '+item.option);else queries.push({...m,sourceQuery:stockQuery(m),name:item.name,option:item.option,skuId:String(item.skuId||'')});});
        if(new Set(STOCK_MAPPING.map(m=>stockKey(m.name,m.option))).size!==STOCK_MAPPING.length)problems.push('내장 상품 목록 중복');
        return {latest,tracked,queries,problems};
    };
    const applyInventoryResults = async (queries,response) => {
        const rows=Array.isArray(response.results)?response.results:[],byQuery=new Map(rows.map(r=>[String(r.query||''),r])),values=new Map(),failures=[];
        queries.forEach(q=>{const r=byQuery.get(stockQuery(q));const p=Array.isArray(r?.products)?r.products.find(x=>String(x.vendoritemid)===q.vendorItemId):null;const qty=p?.stockQuantity;
            if(!r||!r.complete||r.status!=='OK'||!p||p.status!=='OK'||!Number.isSafeInteger(qty)||qty<0){failures.push(q.name+' / '+(q.option||'-'));return;}values.set(stockItemKey(q),qty);});
        if(failures.length||values.size!==queries.length)throw new Error('일부 상품의 표시 수량을 확인하지 못해 전부 저장하지 않았습니다: '+failures.join(', '));
        const ref=db.doc('yomimon_dashboard/inventory_master');
        return db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists)throw new Error('클라우드 원본을 찾지 못했습니다.');const d=await decodeInventoryDocument(snap.data());if(!Array.isArray(d.RD)||!Array.isArray(d.RI))throw new Error('원본 구조가 달라 저장하지 않았습니다.');
            const today=todayKst(),rd=[...d.RD];if(rd.some(x=>String(x).slice(0,10)>today))throw new Error('원본 날짜가 오늘보다 미래입니다. 날짜를 확인해주세요.');
            const latest=rd[rd.length-1],active=d.RI.filter(x=>x.excelActive!==false&&isStockNumber(x.history?.[latest]));if(active.length!==queries.length)throw new Error('조회 중 상품 목록이 변경됐습니다. 새로고침 후 재시도하세요.');
            const keys=new Set();active.forEach(x=>{const key=stockItemKey(x);if(keys.has(key)||!values.has(key))throw new Error('상품 목록이 변경되어 저장을 중단했습니다.');keys.add(key);const q=queries.find(q=>stockItemKey(q)===key);if(String(x.skuId||'')!==q.skuId)throw new Error('SKU가 변경됐습니다. 새로고침 후 확인해주세요.');});
            const runDate=nextRunDate(rd,today);const ri=d.RI.map(x=>rememberStockMapping({...x,history:{...(x.history||{}),[runDate]:values.has(stockItemKey(x))?values.get(stockItemKey(x)):'-'}},resolveStockMapping(x,d.RI)));
            await writeInventoryDocument(tx,ref,d,{RD:[...rd,runDate],RI:ri},true);return runDate;});
    };
    const handleStockFetch = async (automatic=false) => {
        automatic=automatic===true;
        if(stockBusyRef.current||excelBusyRef.current)return;stockBusyRef.current=true;
        try{
            if(!useFirebase)throw new Error('클라우드 연결이 없어 저장하지 않았습니다.');const check=inventoryQueries();
            if(!check.latest||!check.tracked.length||check.problems.length)throw new Error(check.problems.join(', ')||'조회할 숫자 재고 상품이 없습니다.');
            if(!automatic)setStockRun({phase:'loading',message:'Chrome 보조 기능 연결 확인 중...',details:[]});
            const ping=await bridgeRequest('YORGO_STOCK_PING');if(!ping.ok)throw new Error('보조 기능을 사용할 수 없습니다: '+ping.status);
            if(!automatic)setStockRun({phase:'loading',message:check.queries.length+'개 상품의 화면 표시 재고을 조회 중입니다. 잠시 기다려주세요.',details:[]});
            const response=await bridgeRequest('YORGO_STOCK_FETCH',[...new Set(check.queries.map(stockQuery))],260000);
            if(response.retryAfterLogin){if(!loginWaitRef.current)loginWaitRef.current=Date.now();setStockRun({phase:'login',message:response.loginOpened?'쿠팡 창을 열었습니다. 로그인하면 10초 간격으로 확인해 자동 수집합니다. 이 페이지를 닫지 마세요.':'쿠팡 로그인이 필요합니다. 아래 로그인 링크를 열어주세요. 로그인 후 자동 확인합니다.',details:[]});return;}
            if(!response.ok){const states=[...new Set((response.results||[]).filter(r=>!r.complete||r.status!=='OK').map(r=>r.status))];throw new Error('쿠팡 조회 실패 ('+(states.join(', ')||response.status)+'). 쿠팡 로그인/새로고침 후 재시도하세요. 재고는 저장하지 않았습니다.');}
            loginWaitRef.current=0;const runDate=await applyInventoryResults(check.queries,response);setStockRun({phase:'done',message:check.queries.length+'개 상품을 '+runDate+' 열로 추가했습니다. 기존 기록은 유지했습니다.',details:[]});
        }catch(e){setStockRun({phase:'error',message:'저장하지 않았습니다.',details:[String(e.message||e)]});}finally{stockBusyRef.current=false;}
    };

    useEffect(()=>{if(stockRun.phase!=='login')return;const timer=setInterval(()=>{if(Date.now()-loginWaitRef.current>180000){setStockRun({phase:'error',message:'로그인 대기 시간이 지났습니다. 로그인 후 현재고 불러오기를 다시 눌러주세요.',details:[]});return;}handleStockFetch(true);},10000);return()=>clearInterval(timer);},[stockRun.phase]);

    const [showSourceHelp,setShowSourceHelp]=useState(false);
    const [showBridgeHelp,setShowBridgeHelp]=useState(false);
    const downloadSource=async()=>{
        try {
            const response=await fetch(window.location.pathname+'?source_download='+Date.now(),{cache:'no-store'});
            if(!response.ok)throw new Error('원본을 가져오지 못했습니다.');
            const html=await response.text();
            if(!html.toLowerCase().includes('<html'))throw new Error('정상적인 페이지 원본이 아닙니다.');
            const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
            const a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
        } catch(e) { alert('원본 다운로드 실패: '+String(e.message||e)); }
    };

    const handleExcelDownload=async()=>{
        if(excelBusyRef.current)return;excelBusyRef.current=true;setExcelBusy(true);
        try{
            let data={RD:rDates,RI:rItems,DATES:dbDates,STOCK:dbStock,INC:dbInc,AORDER:aOrder};
            if(useFirebase){const snap=await db.doc('yomimon_dashboard/inventory_master').get({source:'server'});if(!snap.exists)throw new Error('클라우드 원본이 없습니다.');data=await decodeInventoryDocument(snap.data());}
            const workbook=await buildInventoryWorkbook(data),buffer=await workbook.xlsx.writeBuffer();
            const url=URL.createObjectURL(new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));const link=document.createElement('a');link.href=url;link.download='Yorgo_통합재고_'+todayKst()+'.xlsx';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
            notify(data.EXCEL_LAYOUT?'원본 숨김 행·열 너비를 반영하고 지난달까지 접은 엑셀을 다운로드했습니다.':'날짜를 간단히 표시하고 지난달까지 접었습니다. 원본의 숨김 행까지 맞추려면 원본 엑셀을 한 번 다시 업로드해주세요.');
        }catch(error){notify('엑셀 다운로드 실패: '+error.message,'err');}finally{excelBusyRef.current=false;setExcelBusy(false);}
    };
    const handleUpload=e=>{
        const file=e.target.files[0]; if(!file)return;
        if(excelBusyRef.current||stockBusyRef.current){notify("진행 중인 작업이 끝난 뒤 업로드해주세요.","err");return;}
        if(!/\.xlsx$/i.test(file.name)){notify("색상과 순서 보존을 위해 .xlsx 형식으로 저장해서 올려주세요.","err");return;}
        excelBusyRef.current=true;setExcelBusy(true);
        const reader=new FileReader();
        reader.onload=async ev=>{
            try{
                if(typeof ExcelJS==='undefined')throw new Error('엑셀 기능을 불러오지 못했습니다. 새로고침해주세요.');
                const styledBook=new ExcelJS.Workbook();await styledBook.xlsx.load(ev.target.result);
                const theme=readExcelTheme(styledBook);
                let source={RD:rDates,RI:rItems,DATES:dbDates,STOCK:dbStock,INC:dbInc,AORDER:aOrder};
                if(useFirebase){const snap=await db.doc('yomimon_dashboard/inventory_master').get({source:'server'});if(!snap.exists)throw new Error('클라우드 원본을 찾지 못했습니다.');source=await decodeInventoryDocument(snap.data());}
                const baseRD=source.RD||[],baseRI=source.RI||[],baseAD=source.DATES||[],baseAS=source.STOCK||{},baseInc=source.INC||[],baseOrder=source.AORDER||[];
                const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true,cellStyles:true});
                const sn=wb.SheetNames;
                const sRocket=sn[0]?wb.Sheets[sn[0]]:null;
                const sArgo  =sn[1]?wb.Sheets[sn[1]]:null;
                const sDisp  =sn[2]?wb.Sheets[sn[2]]:null;

                let nRD=[...baseRD],nRI=[...baseRI];
                let nAD=[...baseAD],nAS={...baseAS};
                let nInc=[...baseInc];
                let nAOrder=[...baseOrder];

                if(!sRocket)throw new Error('로켓배송 시트가 없습니다.');
                const imported=importRocketSheet(sRocket,styledBook.worksheets[0],theme,baseRI,baseRD);nRI=imported.items;nRD=imported.dates;

                if(sArgo){
                    let p=parseSheetWithTimeline(sArgo,3); 
                    if (!p || p.dCols.length === 0) {
                        p = parseSheetWithTimeline(sArgo, 1); 
                    }

                    if(p&&p.dCols.length){
                        const{rows,hri,dCols,parsedDates}=p;
                        nAD = sortInventoryDates([...baseAD,...parsedDates]); 
                        
                        const orig = mergeStockHistory(baseAS); 
                        Object.keys(orig).forEach(k=>{
                            nAS[k]=nAD.map(d=>{const oi=baseAD.indexOf(d);return oi!==-1?(orig[k]?.[oi]||0):0;});
                        });
                        
                        const aExcelSkus = new Set();
                        nAOrder = [];
                        
                        const excelAgg = {};

                        for(let i=hri+1;i<rows.length;i++){
                            const row=rows[i];if(!row?.length)continue;
                            const name = String(row[0]||"").trim();
                            if(!name || name==="undefined") continue;

                            let sku=cleanSku(name);
                            
                            aExcelSkus.add(sku);
                            if(!nAOrder.includes(sku)) nAOrder.push(sku);

                            if(!excelAgg[sku]) excelAgg[sku] = {};
                            
                            dCols.forEach((col,ci)=>{
                                const raw=row[col.index];
                                const val=typeof raw==="number"?Math.round(raw):(parseInt(String(raw).replace(/,/g,""))||0);
                                const pd=parsedDates[ci];
                                
                                if(!excelAgg[sku][pd]) excelAgg[sku][pd] = 0;
                                excelAgg[sku][pd] += val; 
                            });
                        }
                        
                        Object.keys(excelAgg).forEach(sku => {
                            if(!nAS[sku]) nAS[sku] = new Array(nAD.length).fill(0);
                            parsedDates.forEach(pd => {
                                const ui = nAD.indexOf(pd);
                                if(ui !== -1) {
                                    nAS[sku][ui] = excelAgg[sku][pd];
                                }
                            });
                        });
                        
                        Object.keys(nAS).forEach(sku => {
                            if(!aExcelSkus.has(sku)) {
                                parsedDates.forEach(pd => {
                                    const ui = nAD.indexOf(pd);
                                    if(ui !== -1) nAS[sku][ui] = 0;
                                });
                                if(!nAOrder.includes(sku)) nAOrder.push(sku);
                            }
                        });
                    }
                }

                if(sDisp&&XLSX.utils.sheet_to_json(sDisp,{header:1})[0]?.[1]==='출고일'){
                    const rows=XLSX.utils.sheet_to_json(sDisp,{header:1,defval:''});
                    nInc=rows.slice(1).filter(row=>row[0]).map(row=>{
                        const amount=Number(row[2]);if(!Number.isFinite(amount)||amount<0)throw new Error('출고 수량이 올바르지 않습니다.');
                        const extra=row[5]?JSON.parse(String(row[5])):{};
                        return {...extra,sku:String(row[0]),date:String(row[1]),amount,type:String(row[3]),isRegistered:row[4]==='완료'};
                    });
                }else if(sDisp){
                    try{
                        const p=parseSheetWithTimeline(sDisp,1);
                        if(p&&p.dCols.length){
                            const{rows,hri,dCols}=p;const latestArgo=new Date((nAD[nAD.length-1]||"2026-06-02").split(" ")[0]).getTime();
                            for(let i=hri+1;i<rows.length;i++){
                                const row=rows[i];if(!row?.length)continue;
                                const sku=cleanSku(String(row[0]||"").trim());if(!sku)continue;
                                dCols.forEach(col=>{
                                    const dispTime=new Date(col.label.split(" ")[0]).getTime();if(dispTime<=latestArgo)return;
                                    const raw=row[col.index];const amount=typeof raw==="number"?Math.round(raw):(parseInt(String(raw).replace(/,/g,""))||0);if(amount<=0)return;
                                    const type=col.label.includes("용차")?"용차":"택배";const cleanD=col.label.split(" ")[0];
                                    if(!nInc.some(inc=>inc.sku===sku&&inc.date===cleanD&&inc.amount===amount))nInc.push({sku,date:cleanD,amount,type,isRegistered:false});
                                });
                            }
                        }
                    }catch(e){console.warn("출고 시트 스킵:",e);}
                }

                const patch={RD:nRD,RI:nRI,EXCEL_LAYOUT:{
                    rocket:captureSheetLayout(sRocket,styledBook.worksheets[0],theme,true),
                    argo:sArgo?captureSheetLayout(sArgo,styledBook.worksheets[1],theme):source.EXCEL_LAYOUT?.argo||null
                }};
                if(sArgo){patch.DATES=nAD;patch.STOCK=nAS;patch.AORDER=nAOrder;}
                if(sDisp)patch.INC=nInc;
                if(useFirebase){
                    setDbSync('저장 중...');const ref=db.doc('yomimon_dashboard/inventory_master');
                    await db.runTransaction(async tx=>{
                        const live=await tx.get(ref);if(!live.exists)throw new Error('클라우드 원본이 없습니다.');const liveData=live.data();
                        if((liveData.updatedAt?.toMillis()||0)!==(source.updatedAt?.toMillis()||0))throw new Error('분석 중 다른 곳에서 데이터가 변경됐습니다. 엑셀을 다시 올려주세요.');
                        await writeInventoryDocument(tx,ref,source,patch,true);
                    });
                }else{
                    const now=new Date();setLastSyncedAt(now);
                    try{localStorage.setItem(LS_KEY,JSON.stringify({...source,...patch,rocketUpdatedAt:now.toISOString()}));}catch(e){throw new Error('로컬 저장 공간이 부족합니다.');}
                }
                setDbDates(nAD);setDbStock(nAS);setDbInc(nInc);setRDates(nRD);setRItems(nRI);setAOrder(nAOrder);
                if(nRD.length){setRY(nRD[nRD.length-1].slice(0,4));setRM(nRD[nRD.length-1].slice(5,7));}
                notify('엑셀의 상품 순서·색상·수량으로 저장했습니다. 기존 이력은 보존했습니다.');
            }catch(err){console.error(err);setDbSync("엑셀 저장 실패");notify(`엑셀 저장 실패: ${err.message||err}`,"err");}finally{excelBusyRef.current=false;setExcelBusy(false);}
        };
        reader.onerror=()=>{excelBusyRef.current=false;setExcelBusy(false);notify("엑셀 파일을 읽지 못했습니다.","err");};
        reader.readAsArrayBuffer(file);
    };

    const toggleReg=async idx=>{
        if(excelBusyRef.current||stockBusyRef.current)return;
        const t=pend[idx];if(!t)return;
        excelBusyRef.current=true;setExcelBusy(true);
        try {
            const markReceived=data=>{
                const records=data.INC||[],gi=records.findIndex(x=>x.sku===t.sku&&x.date===t.date&&x.amount===t.amount);
                if(gi<0||records[gi].isRegistered)return null;
                const upd=records.map((x,i)=>i===gi?{...x,isRegistered:true}:x),us={...(data.STOCK||{})};
                const ci=(data.DATES||[]).indexOf(aD);
                if(us[t.sku]&&ci!==-1){us[t.sku]=[...us[t.sku]];us[t.sku][ci]+=t.amount;}
                return {STOCK:us,INC:upd};
            };
            let changed=false;
            if(useFirebase){
                const ref=db.doc('yomimon_dashboard/inventory_master');
                changed=await db.runTransaction(async tx=>{
                    const snap=await tx.get(ref);if(!snap.exists)throw new Error('클라우드 원본이 없습니다.');
                    const data=await decodeInventoryDocument(snap.data()),patch=markReceived(data);
                    if(!patch)return false;
                    await writeInventoryDocument(tx,ref,data,patch);return true;
                });
            }else{
                const data={DATES:dbDates,STOCK:dbStock,INC:dbInc,RD:rDates,RI:rItems,AORDER:aOrder},patch=markReceived(data);
                if(patch){localStorage.setItem(LS_KEY,JSON.stringify({...data,...patch}));setDbInc(patch.INC);setDbStock(patch.STOCK);changed=true;}
            }
            if(changed)notify(`${t.sku} 입고 완료! +${t.amount.toLocaleString()}개 즉시 합산됨`);
        }catch(error){notify('입고 저장 실패: '+error.message,'err');}
        finally{excelBusyRef.current=false;setExcelBusy(false);}
    };

                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-center font-bold outline-none focus:ring-2 focus:ring-indigo-500"/>
                    {pwdErr&&<p className="text-xs text-red-500 font-bold animate-bounce">⚠️ 비밀번호가 일치하지 않습니다.</p>}

    return(
        <div className="min-h-screen flex flex-col">
            <header className="bg-gradient-to-r from-slate-900 to-indigo-950 text-white shadow-lg pt-5 pb-0 px-6 md:px-10 relative z-50">

                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        </a>
                        <a href="https://arxotn-git.github.io/CLSTOCK/clindex.html" 
                           className="inline-flex items-center gap-2 px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white text-sm font-extrabold rounded-xl transition-all shadow-md active:scale-95">
                            <span>재고 관리</span>
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                </div>
                {false && (
                    /* N배송 관리 중단으로 탭 비활성화 (삭제 아님 - 필요 시 false만 제거하면 복원) */
                    <div className="flex gap-2 px-2 mt-0">
                        {[
                            ["rocket","🚀 로켓배송 재고","blue"],
                            ["argo_raw","📋 N배송 재고","emerald"],
                            ["argo","📦 N배송(품절 예상일)","indigo"]
                        ].map(([k,l,c])=>(
                            <button key={k} onClick={()=>changeView(k)}
                                className={`px-6 py-3 font-extrabold text-sm rounded-t-xl tab-btn ${view===k?`bg-slate-50 text-${c}-900 border-t-4 border-${c}-600`:"bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white border-t-4 border-transparent"}`}>
                                {l}
                            </button>
                        ))}
                    </div>
                )}
            </header>

            {notif && (
                <div className="fixed top-12 left-1/2 transform -translate-x-1/2 z-[9999] pointer-events-none toast-animate">
                    <div className={`px-6 py-3 rounded-full shadow-2xl border-2 text-sm font-extrabold flex items-center gap-3 ${
                        notif.type==="err" ? "bg-red-600 text-white border-red-700" : "bg-indigo-600 text-white border-indigo-700"
                    }`}>
                        <span className="text-xl">{notif.type==="err" ? "❌" : "✅"}</span>
                        <span>{notif.msg}</span>
                    </div>
                </div>
            )}

            {}
            {/* ─── 로켓배송 탭 ─── */}
            {view==="rocket"&&(
                <main className="flex-grow w-full px-6 md:px-10 py-6 bg-slate-50 flex flex-col gap-6 animate-fade-in">
                    {rDates.length===0?(
                        <div className="flex flex-col items-center justify-center py-28 text-center bg-white rounded-3xl border border-slate-100 shadow-sm">
                            <span className="text-6xl mb-5">🚀</span>
                            <h3 className="text-xl font-extrabold text-slate-600">로켓배송 데이터가 없습니다</h3>
                            <p className="text-sm text-slate-400 mt-2">하단 엑셀 업로드 영역에서 파일을 올려주세요.</p>
                        </div>
                    ):(
                        <>
                            <div className="flex flex-col xl:flex-row xl:items-center gap-4 bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                                <div className="flex-shrink-0"><h2 className="font-extrabold text-slate-800 text-xl px-2 whitespace-nowrap flex items-center gap-2 flex-shrink-0">🚀 로켓배송 실시간 상황판 <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">{filtRI.length}개 상품</span></h2><p className="px-2 mt-1.5 text-xs font-medium text-slate-500">재고 업데이트: {lastSyncedAt?fmtSyncTime(lastSyncedAt):"확인 중"}</p></div>

                                <div className="flex flex-col xl:flex-row xl:items-center gap-2 flex-1 min-w-0">
                                    {/* 검색 입력창: 남은 가로 공간만큼 확장 */}
                                    <div className="relative flex-1 min-w-[160px]">
                                        <input type="text" placeholder="상품명 또는 SKU ID 검색..." value={srch} onChange={e=>setSrch(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-blue-500/30"/>
                                        <span className="absolute left-3.5 top-3 text-slate-400">🔍</span>
                                    </div>

                                            <input type="checkbox" checked={rShowZero} onChange={e=>setRShowZero(e.target.checked)} className="rounded border-slate-300 text-blue-600 w-3.5 h-3.5 cursor-pointer"/>

                                        </label>
                                        <button type="button" onClick={openColors} aria-expanded={showColors} className="px-3 py-2 text-xs font-medium rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">색상 설정</button>
                                        <button type="button" onClick={()=>setShowAllDailyRuns(v=>!v)} aria-pressed={showAllDailyRuns} className={`px-3 py-2 text-xs font-bold rounded-xl border transition-all ${showAllDailyRuns?'bg-blue-50 border-blue-300 text-blue-700':'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'}`}>{showAllDailyRuns?'같은 날짜 기록 접기':'같은 날짜 기록 펼치기'}</button>

                                    </div>
                                </div>

                                <div className="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                                    {excelColors.map(hex=><div key={hex} className="flex items-center gap-3 rounded-xl border border-slate-200 p-3">

                                        <span className="text-xs font-mono text-slate-500">{hex}</span>
                                        <span className="text-slate-400">→</span>
                                        <input type="color" aria-label={hex+' 웹 배경색'} value={draftColors[hex]||softExcelColor(hex)} onChange={e=>setDraftColors(v=>({...v,[hex]:e.target.value.toUpperCase()}))} className="h-8 w-10 cursor-pointer rounded"/>

                                        <button type="button" onClick={()=>setDraftColors(v=>{const next={...v};delete next[hex];return next;})} className="ml-auto text-xs text-slate-500 underline">자동</button>
                                    </div>)}

                                    <button type="button" onClick={()=>setShowColors(false)} disabled={colorSaving} className="rounded-lg px-4 py-2 text-sm text-slate-500">닫기</button>
                                </div>
                            </section>}

                            {stockRun.phase!=="idle"&&<div className={`rounded-2xl border p-4 text-sm font-bold ${stockRun.phase==="error"?"bg-red-50 border-red-200 text-red-800":stockRun.phase==="login"?"bg-amber-50 border-amber-200 text-amber-900":"bg-blue-50 border-blue-200 text-blue-900"}`}><div>{stockRun.message}</div>{stockRun.phase==="login"&&<button onClick={handleStockFetch} className="mt-2 px-3 py-1.5 rounded-lg bg-amber-600 text-white text-xs font-extrabold">재시도</button>}{stockRun.details.map((d,i)=><div key={i} className="mt-1 text-xs whitespace-pre-wrap">• {d}</div>)}{stockRun.phase==="error"&&<div className="mt-2 text-xs font-normal">확장 프로그램이 없으면 설치 후 이 페이지를 새로고침하세요. 로그인 정보나 비밀값은 이 페이지에 입력하지 않습니다.</div>}</div>}
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-100 flex-grow freeze-wrap">
                                {filtRI.length===0?(
                                    <div className="py-16 text-center"><p className="text-slate-400 text-sm">해당 조건에 맞는 상품이 없습니다.</p>
                                        {!rShowZero&&<button onClick={()=>setRShowZero(true)} className="mt-3 text-xs text-blue-600 underline font-bold cursor-pointer">→ 재고 0개 상품도 표시하기</button>}
                                    </div>
                                ):(
                                    <table className="rocket-grid text-left border-collapse" style={{tableLayout:"fixed",width:`${380+Math.max(1,visRD.length)*80}px`,minWidth:`${380+Math.max(1,visRD.length)*80}px`}}>

                                            <col style={{width:"var(--col-name)"}}/><col style={{width:"var(--col-opt)"}}/><col style={{width:"var(--col-sku)"}}/>

                                        <thead className="freeze-header">
                                            <tr className="text-slate-600 text-xs font-bold uppercase whitespace-nowrap border-b-2 border-slate-200">

                                        </thead>
                                        <tbody className="text-sm">
                                            {filtRI.map((item,idx)=>{
                                                const isNew=idx>0&&filtRI[idx-1].name!==item.name;
                                                const rowCls=`hover:bg-blue-50/40 transition-colors ${isNew?"border-t-2 border-blue-300":"border-t border-slate-100"}`;
                                                const bgNew="bg-white";
                                                const txtNew="text-slate-800";
                                                const cat=getBookToyCat(item.name);
                                                const nameBg=cat==="book"?"bg-emerald-50":cat==="toy"?"bg-orange-50":bgNew;
                                                const nameTxt=cat==="book"?"text-emerald-900":cat==="toy"?"text-orange-900":txtNew;
                                                const nameBorder=cat==="book"?"border-l-4 border-emerald-400":cat==="toy"?"border-l-4 border-orange-400":"border-l-4 border-transparent";
                                                return(
                                                    <tr key={idx} className={rowCls}>
                                                        <td style={item.excelStyles?{...displayCellStyle(item,0),borderLeftColor:itemCellStyle(item,0).backgroundColor}:undefined} className={`py-4 px-5 font-extrabold fc1 whitespace-nowrap overflow-hidden text-ellipsis ${nameBg} ${nameTxt} ${nameBorder}`}>{item.name}</td>

                                                        <td style={displayCellStyle(item,2)} className={`py-4 px-5 font-mono text-slate-400 text-xs fc3 whitespace-nowrap ${bgNew}`}>{item.skuId||"-"}</td>
                                                        {visRD.length===0&&<td className={bgNew}></td>}
                                                        {visRD.map((d,i)=>{
                                                            const v=item.history[d];const num=(v!=null&&v!==""&&v!=="-")?Number(v):null;
                                                            const wkStart=isWeekStartDate(rDates,rDates.indexOf(d));
                                                            return(
                                                                <td key={i} style={{...displayCellStyle(item,0,d),...(wkStart?{backgroundColor:"#FFF1DF",color:"#C06014"}:{})}} className={`py-4 px-4 text-center font-bold ${bgNew} ${wkStart?"text-orange-600":num===null?"text-slate-300":num===0?"text-red-500":"text-slate-700"}`}>
                                                                    {num!==null?(isNaN(num)?String(v):num.toLocaleString()):"-"}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </>
                    )}
                </main>

            {}

                                <Dropdown value={aM} options={aMons.map(m=>({value:m,label:`${m}월`}))} onChange={setAM}/>
                                <div className="w-px h-6 bg-slate-700"/>
                                <Dropdown value={aD} options={aDatesM.map(d=>({value:d,label:`${d.slice(8)}일${d===dbDates[dbDates.length-1]?" (최신)":""}`}))} onChange={setAD}/>

                                {value:3,label:"최근 3일 기준"},

                                {value:5,label:"최근 5일 기준"},
                                {value:7,label:"최근 7일 기준"},

                            ]} onChange={setAdsW}/>
                        </div>
                    </div>

                    <div className={`${pend.length>0?"bg-gradient-to-r from-amber-50 to-orange-50 border-2 border-orange-200":"bg-white border-2 border-slate-200"} rounded-3xl shadow-sm overflow-hidden`}>
                        <div className="p-4 md:p-6"><h3 className={`text-lg font-extrabold ${pend.length>0?"text-orange-900":"text-slate-600"}`}>{pend.length>0?"⚠️ 7일 내 공장 출고완료 대기현황":"🎉 모든 공장 출고건이 아르고 센터에 입고 완료되었습니다."}</h3></div>
                        {pend.length>0&&(
                            <div className="px-4 md:px-6 pb-6 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                                {pend.map((inc,idx)=>(
                                    <div key={idx} className="bg-white p-4 rounded-2xl border border-orange-200/60 shadow-sm flex flex-col gap-3">
                                        <div className="flex items-center justify-between"><span className="text-xs font-black bg-orange-100 text-orange-800 px-2 py-0.5 rounded-md">{inc.type} 수송</span><span className="text-xs font-bold text-slate-400">출고: {inc.date.slice(5)}</span></div>
                                        <h4 className="font-extrabold text-slate-800 text-sm">{inc.sku}</h4>
                                        <span className="text-2xl font-black text-orange-600">+{inc.amount.toLocaleString()} <span className="text-xs text-slate-500">개 대기</span></span>
                                        <button onClick={()=>toggleReg(idx)} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold px-3 py-2 rounded-lg transition-colors cursor-pointer active:scale-95">입고 완료처리 ✓ (현재고 + 합산)</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        {[
                            {label:"🚨 7일내 긴급 대응",val:summ.crit,unit:"개 SKU",c:"text-red-600"},{label:"⚠️ 30일내 보충 경고",val:summ.warn,unit:"개 SKU",c:"text-amber-500"},
                            {label:"📦 보관 총 재고수량",val:summ.tot.toLocaleString(),unit:"개",c:"text-indigo-600"},{label:"🚚 일평균 판매량(ADS)",val:summ.ads,unit:"개/일",c:"text-teal-600"},
                        ].map(({label,val,unit,c})=>(
                            <div key={label} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{label}</span>
                                <div className="flex items-baseline gap-2 mt-2"><span className={`text-4xl font-extrabold ${c}`}>{val}</span><span className="text-sm text-slate-500 font-bold">{unit}</span></div>
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        <div className="lg:col-span-9 bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col">
                            <div className="p-6 border-b border-slate-100 bg-slate-50/50 space-y-4 rounded-t-3xl">
                                <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                                    <h2 className="font-bold text-slate-800 text-lg flex items-center gap-2">📋 실시간 입출고/품절 예측 상황판 <span className="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold">{filtSkus.length}개 표시</span></h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                                    <div className="md:col-span-6 relative">
                                        <input type="text" placeholder="품목명 검색..." value={srch} onChange={e=>setSrch(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500/20"/>

                                    </div>

                            </div>
                            <div className="freeze-wrap rounded-b-3xl">
                                <table className="w-full text-left border-collapse" style={{tableLayout:"fixed", minWidth:"820px"}}>
                                    <colgroup><col style={{width:"200px"}}/><col style={{width:"110px"}}/><col style={{width:"80px"}}/><col style={{width:"130px"}}/><col style={{width:"110px"}}/><col style={{width:"120px"}}/></colgroup>
                                    <thead className="freeze-header">
                                        <tr className="text-slate-500 text-xs font-extrabold uppercase tracking-wider border-b border-slate-200">
                                            <th className="py-4 px-6 sticky left-0 top-0 bg-slate-100 !z-[60] shadow-[2px_0_4px_-2px_rgba(0,0,0,0.2)] border-r border-slate-300">SKU</th>
                                            <th className="py-4 px-6 text-center z-[30]">현재고 ({aD.slice(5)})</th>
                                            <th className="py-4 px-6 text-center z-[30]">ADS</th>
                                            <th className="py-4 px-6 z-[30]">예상 품절일</th>
                                            <th className="py-4 px-6 z-[30]">잔여기간</th>
                                            <th className="py-4 px-6 text-right z-[30]">보충 필요(30일)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {filtSkus.length===0?(<tr><td colSpan="6" className="py-12 text-center text-slate-400 font-medium">조건에 맞는 품목이 없습니다.</td></tr>)
                                        :filtSkus.map(item=>{
                                            const isSel=selSku===item.sku;const isCrit=item.daysRemaining<=10;const isWarn=item.daysRemaining>10&&item.daysRemaining<=30;
                                            return(
                                                <tr key={item.sku} onClick={()=>setSelSku(item.sku)} className={`hover:bg-indigo-50/40 cursor-pointer transition-all border-l-4 ${isSel?"!border-l-[4px] !border-indigo-600 bg-indigo-50/80":"border-l-[4px] border-transparent"}`}>
                                                    <td className="py-5 px-6 font-bold text-slate-900 bg-white sticky left-0 z-[20] shadow-[2px_0_4px_-2px_rgba(0,0,0,0.15)] border-r border-slate-200">{item.sku}</td>
                                                    <td className="py-5 px-6 text-center font-extrabold text-slate-900 text-base">{item.currentStock.toLocaleString()}{item.simulatedArrivals>0&&<span className="block text-xs text-emerald-600 font-extrabold mt-0.5">(+{item.simulatedArrivals} 예약)</span>}</td>
                                                    <td className="py-5 px-6 text-center font-mono font-bold text-slate-700">{item.ads.toFixed(2)}</td>
                                                    <td className="py-5 px-6"><span className={`font-mono text-sm px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 w-max ${isCrit?"bg-red-100 text-red-800":isWarn?"bg-amber-100 text-amber-800":"text-slate-600"}`}>📅 {item.expectedStockoutDate}</span></td>
                                                    <td className="py-5 px-6"><span className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold ${isCrit?"bg-red-200 text-red-900":isWarn?"bg-amber-200 text-amber-900":"bg-emerald-200 text-emerald-900"}`}>{item.displayRemainingText}</span></td>
                                                    <td className="py-5 px-6 text-right font-extrabold text-indigo-700 text-base">{item.replenishment30.toLocaleString()}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </main>
            )}

            {}
            {/* ── N배송 원본 탭 ── */}
            {view==="argo_raw"&&(
                <main className="flex-grow w-full px-6 md:px-10 py-6 bg-slate-50 flex flex-col gap-6 animate-fade-in">
                    {dbDates.length===0?(
                        <div className="flex flex-col items-center justify-center py-28 text-center bg-white rounded-3xl border border-slate-100 shadow-sm">
                            <span className="text-6xl mb-5">📋</span>
                            <h3 className="text-xl font-extrabold text-slate-600">N배송 데이터가 없습니다</h3>
                            <p className="text-sm text-slate-400 mt-2">하단 엑셀 업로드 영역에서 파일을 올려주세요.</p>
                        </div>
                    ):(
                        <>
                            <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-4 bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                                <h2 className="font-extrabold text-slate-800 text-xl px-2 whitespace-nowrap">📋 N배송 재고 <span className="ml-1 text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">{filtARaw.length}개 상품 표시</span></h2>
                                
                                {/* 🔥 N배송 원본 탭 검색 입력창 추가 */}
                                <div className="relative w-full xl:w-72 flex-shrink-0">
                                    <input type="text" placeholder="품목명 검색..." value={srch} onChange={e=>setSrch(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500/30"/>
                                    <span className="absolute left-3.5 top-3 text-slate-400">🔍</span>
                                </div>

                                <div className="flex flex-wrap items-center gap-2">
                                    <label className="flex items-center gap-1.5 text-xs font-bold text-slate-600 cursor-pointer select-none bg-slate-100 px-3 py-2 rounded-xl">
                                        <input type="checkbox" checked={aRawShowZero} onChange={e=>setARawShowZero(e.target.checked)} className="rounded border-slate-300 text-emerald-600 w-3.5 h-3.5 cursor-pointer"/>
                                        <span>재고 0개도 보기</span>
                                    </label>
                                    <ModeBtns mode={aRawMode} setMode={setARawMode} color="emerald"/>
                                    <div className="flex items-center gap-1 bg-slate-800 rounded-xl p-1 border border-slate-700">
                                        <Dropdown value={aRawY} options={aYears.map(y=>({value:y,label:`${y}년`}))} onChange={v=>{setARawY(v);setARawMode("MONTH");}}/>
                                        <div className="w-px h-6 bg-slate-700"/>
                                        <Dropdown value={aRawM} options={aRawMons.map(m=>({value:m,label:`${m}월`}))} onChange={v=>{setARawM(v);setARawMode("MONTH");}}/>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-100 flex-grow freeze-wrap">
                                {filtARaw.length===0?(
                                    <div className="py-16 text-center"><p className="text-slate-400 text-sm">해당 조건에 맞는 N배송 상품이 없습니다.</p>
                                        {!aRawShowZero&&<button onClick={()=>setARawShowZero(true)} className="mt-3 text-xs text-emerald-600 underline font-bold cursor-pointer">→ 재고 0개도 표시하기</button>}
                                    </div>
                                ):(
                                    <table className="w-full text-left border-collapse" style={{tableLayout:"fixed",minWidth:"1000px"}}>
                                        <colgroup>
                                            <col style={{width:"200px"}}/>
                                            {visAD.length===0&&<col style={{width:"150px"}}/>}
                                            {visAD.map(d=><col key={d} style={{width:"80px"}}/>)}
                                            <col style={{width:"auto"}}/>
                                        </colgroup>
                                        <thead className="freeze-header">
                                            <tr className="text-slate-600 text-xs font-bold uppercase whitespace-nowrap border-b-2 border-slate-200">
                                                <th className="py-4 px-5 sticky left-0 !z-50 bg-slate-100 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.2)] border-r border-slate-300">SKU</th>
                                                {visAD.length===0&&<th className="py-4 px-5">해당 기간 데이터 없음</th>}
                                                {visAD.map(d=><th key={d} className="py-4 px-4 text-center sticky top-0 z-20 bg-slate-100">{d.slice(5)}</th>)}
                                                <th className="py-4 px-0 bg-slate-100 sticky top-0 z-20"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm">
                                            {filtARaw.map((item,idx)=>{
                                                const prevCat=idx>0?CATS[filtARaw[idx-1].sku]:null;const curCat=CATS[item.sku];const isNew=prevCat!==null&&prevCat!==curCat;
                                                const bg=isNew?"bg-[#ecfdf5]":"bg-white";
                                                const rowCls=`hover:bg-emerald-50/40 transition-colors ${isNew?"border-t-[3px] border-emerald-400":"border-t border-slate-100"}`;
                                                return(
                                                    <tr key={idx} className={rowCls}>
                                                        <td className={`py-4 px-5 font-bold sticky left-0 z-40 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.15)] border-r border-slate-200 whitespace-nowrap overflow-hidden text-ellipsis ${bg} ${isNew?"text-emerald-900":"text-slate-900"}`}>{item.sku}</td>
                                                        {visAD.length===0&&<td className={bg}></td>}
                                                        {visAD.map((d,i)=>{
                                                            const dateIdx=dbDates.indexOf(d);const val=item.history?.[dateIdx];const num=(val!=null&&val!==undefined&&val!=="-")?Number(val):null;
                                                            return(<td key={i} className={`py-4 px-4 text-center font-bold ${bg} ${num===null?"text-slate-300":num===0?"text-red-500":"text-slate-700"}`}>{num!==null?num.toLocaleString():"-"}</td>);
                                                        })}
                                                        <td className={bg}></td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </>
                    )}
                </main>
            )}

            {}
            {/* 공통 엑셀 업로드 */}
            <div className="px-6 md:px-10 pb-10 w-full mt-auto">
                <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 space-y-4">
                    <div className="flex flex-wrap justify-between items-start gap-4">
                      <div>
                        <h4 className="font-extrabold text-slate-800 text-base flex items-center gap-2">
                            📊 통합 엑셀 파일 직접 연동 관리자
                        </h4>
                        <p className="text-xs text-slate-400 mt-1">엑셀(.xlsx)의 상품 순서와 셀 색상을 최우선으로 반영하며, 전체 이력은 압축해서 보관합니다. 현재고를 불러와도 이 설정과 기존 이력은 유지됩니다.</p>
                      </div>
                      <div className="flex flex-col items-start md:items-end gap-2">
                        <div className="flex flex-wrap gap-2">
                          <button type="button" onClick={handleExcelDownload} disabled={excelBusy} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white text-sm font-bold rounded-xl shadow-sm">{excelBusy?"엑셀 처리 중...":"엑셀 다운로드"}</button>
                          <button type="button" onClick={downloadSource} className="px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white text-sm font-extrabold rounded-xl shadow-sm">원본 다운로드</button>
                          <button type="button" onClick={()=>setShowSourceHelp(v=>!v)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-extrabold rounded-xl shadow-sm">원본 소스 업데이트</button>
                        </div>
                        <button type="button" onClick={()=>setShowBridgeHelp(v=>!v)} aria-expanded={showBridgeHelp} className="text-xs font-semibold text-slate-500 hover:text-blue-700 flex items-center gap-1.5"><span className="text-blue-600">ⓘ</span> 보조 기능 설치 안내 <span aria-hidden="true">{showBridgeHelp?'▴':'▾'}</span></button>
                        <a className="text-xs text-blue-600 underline" target="_blank" rel="noopener noreferrer" href="https://advertising.coupang.com/marketing/campaign/registration?goalType%3DSALES&amp;_cap_client=SUPPLIERHUB">쿠팡 로그인/광고센터 열기</a>
                      </div>
                    </div>
                    {showBridgeHelp&&<div className="rounded-2xl border border-blue-100 bg-blue-50/50 p-5 sm:p-6 text-slate-700">
                      <div className="flex flex-wrap items-start justify-between gap-3 mb-4"><div><h5 className="text-base font-bold text-slate-800">Chrome 보조 기능 설치 안내</h5><p className="text-sm text-slate-500 mt-1">회사 PC에서 처음 한 번만 설치하세요.</p></div><button type="button" onClick={()=>setShowBridgeHelp(false)} className="text-sm font-semibold text-slate-500 hover:text-slate-800">닫기 ✕</button></div>
                      <ol className="grid gap-2 text-sm leading-relaxed sm:grid-cols-2"><li className="bg-white rounded-xl border border-blue-100 p-3"><b className="text-blue-600 mr-2">01</b><a href="./yorgo-stock-bridge.zip" download className="text-blue-700 font-bold underline">보조 기능 ZIP 다운로드</a> 후 압축을 풉니다.</li><li className="bg-white rounded-xl border border-blue-100 p-3"><b className="text-blue-600 mr-2">02</b>Chrome 주소창에 <b>chrome://extensions</b>를 입력합니다.</li><li className="bg-white rounded-xl border border-blue-100 p-3"><b className="text-blue-600 mr-2">03</b>개발자 모드를 켜고 <b>압축해제된 확장 프로그램 로드</b>를 누릅니다.</li><li className="bg-white rounded-xl border border-blue-100 p-3"><b className="text-blue-600 mr-2">04</b><b>manifest.json이 있는 폴더</b>를 선택한 뒤 이 페이지를 새로고침합니다.</li></ol>
                      <p className="mt-4 text-sm text-slate-600 leading-relaxed">압축을 푼 폴더는 삭제하지 마세요. 설치 후 <b>현재고 불러오기</b>를 누르고, 쿠팡 로그인 창이 열리면 로그인하세요. 로켓 재고만 새 열로 추가하며 N배송·출고는 변경하지 않습니다.</p>
                    </div>}
                    {showSourceHelp&&<div className="rounded-xl bg-slate-50 border border-slate-200 p-4 text-sm text-slate-700 space-y-2"><p className="font-bold">수정한 웹페이지 원본 올리기</p><p>1. 원본 다운로드로 받은 index.html을 수정합니다. 이름은 반드시 index.html로 유지하세요.</p><p>2. 아래 GitHub 업로드 화면을 열고 저장소 소유 계정으로 로그인합니다.</p><p>3. Choose your files에서 수정한 index.html을 고른 뒤 Commit changes를 누릅니다. 게시까지 잠시 걸릴 수 있습니다.</p><p>원본은 페이지 코드이며 재고 데이터 백업이 아닙니다. 출처가 불확실한 코드는 올리지 마세요. 이전 원본은 GitHub 기록에서 복구할 수 있습니다.</p><a href="https://github.com/arxotn-git/yorgo/upload/main" target="_blank" rel="noopener noreferrer" className="inline-block text-blue-700 font-bold underline">GitHub 업로드 화면 열기 ↗</a></div>}
                    <div className="border-2 border-dashed border-indigo-200 hover:border-indigo-500 rounded-2xl p-10 text-center transition-colors bg-indigo-50/20 relative cursor-pointer">
                        <input type="file" accept=".xlsx" disabled={excelBusy} onChange={handleUpload} onClick={e=>e.target.value=null} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10"/>
                        <span className="text-4xl block mb-4">📂</span>
                        <h5 className="text-sm font-extrabold text-indigo-950">여기에 엑셀 파일을 드래그 앤 드롭 하세요</h5>
                    </div>
                </div>
            </div>

            <footer className="bg-slate-900 text-slate-500 text-xs py-6 border-t border-slate-800 text-center">
                <p>© 2026 요미몬(주) All Rights Reserved.</p>
            </footer>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
